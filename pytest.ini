[pytest]
# Settings de desenvolvimento: SQLite e Celery eager, sem depender de Postgres
# nem de Redis. Os settings de produção não servem para teste — o
# SECURE_SSL_REDIRECT transforma todo request do test client em 301.
DJANGO_SETTINGS_MODULE = config.settings.development

# O padrão do pytest é test_*.py, que não encontra nada aqui: a convenção do
# projeto é tests.py por app, mais tests_<assunto>.py quando o app tem vários
# módulos de teste. Sem esta linha a suíte é coletada vazia (pytest sai com 5).
python_files = tests.py tests_*.py test_*.py

# Restringe a busca aos apps (mais config/, que testa as settings de produção):
# deploy/ e scripts/ têm .py que não são teste.
testpaths = accounts ai carteira config core legal zap

addopts = --strict-markers -m "not e2e"

markers =
    e2e: teste de ponta a ponta num navegador (Playwright)
    ia_real: chama a API da Anthropic de verdade (custa dinheiro; fora da suíte)
