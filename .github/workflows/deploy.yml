name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    uses: rigst/ci/.github/workflows/deploy-django.yml@f556f2f1bc80ccb43fa31947b076a771f791a368  # v1
    secrets:
      CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
    with:
      ssh-host: "dracma.stolben.com"
