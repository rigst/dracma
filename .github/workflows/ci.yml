name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:          # reprovocação manual; o CD pende de workflow_run

permissions: { contents: read }

jobs:
  ci:
    # SHA e não @v1: a tag é ponteiro móvel, e assim o Dependabot abre PR
    # revisável quando o CI central muda.
    uses: rigst/ci/.github/workflows/python-django.yml@2b481558bbdc44c8e7700f9fe267a94b2e2dbb09 # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # o que precisa.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings.production
      test-settings-module: config.settings.development
      source-paths: "accounts ai bot carteira config core legal"
      postgres: false

      # Nada tolerado: toda etapa bloqueia. O caminho foi o do RUNBOOK.md §4
      # do rigst/ci, medindo o passivo antes de fechar o portão.
      #
      # ruff, mypy, pytest, bandit e pip-audit saíram daqui já na primeira
      # subida, medidos nesta máquina contra as mesmas configurações do
      # pipeline. As quatro que dependem de navegador e de Node subiram
      # toleradas no run 35273160297, que é o que mediu o passivo: licenças
      # e layout já estavam limpas, a11y só reprovava porque /termos/ e
      # /privacidade/ davam 404 sem o comando de preparação, e o frontend
      # trazia 12 `button` sem `type` (mais um aviso de ESLint). Tudo isso
      # está consertado, então nada fica tolerado: etapa em soft-fail é
      # etapa que não segura nada, e o passivo cresce sem ninguém ver.
      soft-fail: ""

      # Valores fictícios só para os settings de produção carregarem no job
      # `django` (check --deploy). Nada aqui toca serviço real.
      django-env: |
        SECRET_KEY=ci-only-7f2A9b1C4d6E8g0H-iJkLmNoPqRsTuVwXyZ-abcdefghij
        ALLOWED_HOSTS=example.com
        DEBUG=False
        DB_NAME=dracma
        DB_USER=dracma
        DB_PASSWORD=ci-only
        DB_HOST=localhost
        DB_PORT=5432
        REDIS_URL=redis://localhost:6379/6
        CACHE_REDIS_URL=redis://localhost:6379/4
        SESSION_REDIS_URL=redis://localhost:6379/5
      test-env: |
        ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        SIGNUP_ENABLED=True

      run-diff-quality: true
      diff-quality-fail-on: erro

      run-frontend: true
      frontend-paths: "static"
      template-paths: "templates"
      # Explícito, e igual ao resto da frota: todo achado de Stylelint entra
      # como aviso porque a etapa lê o arquivo inteiro, e o que reprova é
      # ESLint de severidade 2 e template estruturalmente quebrado.
      frontend-fail-on: erro

      # Rotas públicas: sem login, sem dado de ninguém.
      run-layout: true
      layout-setup-command: python manage.py importar_documentos_legais --publicar
      layout-paths: |
        /login/
        /termos/
        /privacidade/
      run-a11y: true
      # Sem isto /termos/ e /privacidade/ respondem 404: os documentos legais
      # são versionados em legal/documentos/ e só existem no banco depois de
      # publicados. O axe media a página de erro, e o que reprova não é
      # acessibilidade, é a rota vazia. Mesmo comando do layout.
      a11y-setup-command: python manage.py importar_documentos_legais --publicar
      a11y-paths: |
        /login/
        /termos/
        /privacidade/

      run-licencas: true
      run-sbom: true
      run-lock: true
      run-e2e: false

      # DESLIGADO até o repositório ter o SONAR_TOKEN: sem ele o scanner morre
      # com "Not authorized" e derruba o CI inteiro. Para ligar, crie o projeto
      # `rigst_dracma` no SonarCloud, grave o token em Settings > Secrets and
      # variables > Actions e troque a linha abaixo pela que está comentada.
      # A guarda do dependabot é necessária porque o GitHub não entrega os
      # secrets do Actions àquele ator, e sem ela toda PR dele falharia.
      #
      #   run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      run-sonar: false
      sonar-project-key: rigst_dracma
      sonar-organization: rigst
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests_*.py,**/tests.py,**/fakes.py,**/*.js,**/*.html
