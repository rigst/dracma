name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:          # reprovocação manual; o CD pende de workflow_run

permissions: { contents: read }

jobs:
  ci:
    # SHA e não @v1: a tag é ponteiro móvel, e assim o Dependabot abre PR
    # revisável quando o CI central muda.
    uses: rigst/ci/.github/workflows/python-django.yml@2b481558bbdc44c8e7700f9fe267a94b2e2dbb09 # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # o que precisa.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings.production
      test-settings-module: config.settings.development
      source-paths: "accounts ai bot carteira config core legal"
      postgres: false

      # Nada tolerado: toda etapa bloqueia. O caminho foi o do RUNBOOK.md §4
      # do rigst/ci, medindo o passivo antes de fechar o portão.
      #
      # ruff, mypy, pytest, bandit e pip-audit saíram daqui já na primeira
      # subida, medidos nesta máquina contra as mesmas configurações do
      # pipeline. As quatro que dependem de navegador e de Node subiram
      # toleradas no run 35273160297, que é o que mediu o passivo: licenças
      # e layout já estavam limpas, a11y só reprovava porque /termos/ e
      # /privacidade/ davam 404 sem o comando de preparação, e o frontend
      # trazia 12 `button` sem `type` (mais um aviso de ESLint). Tudo isso
      # está consertado, então nada fica tolerado: etapa em soft-fail é
      # etapa que não segura nada, e o passivo cresce sem ninguém ver.
      soft-fail: ""

      # Valores fictícios só para os settings de produção carregarem no job
      # `django` (check --deploy). Nada aqui toca serviço real.
      django-env: |
        SECRET_KEY=ci-only-7f2A9b1C4d6E8g0H-iJkLmNoPqRsTuVwXyZ-abcdefghij
        ALLOWED_HOSTS=example.com
        DEBUG=False
        DB_NAME=dracma
        DB_USER=dracma
        DB_PASSWORD=ci-only
        DB_HOST=localhost
        DB_PORT=5432
        REDIS_URL=redis://localhost:6379/6
        CACHE_REDIS_URL=redis://localhost:6379/4
        SESSION_REDIS_URL=redis://localhost:6379/5
      test-env: |
        ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        SIGNUP_ENABLED=True

      run-diff-quality: true
      diff-quality-fail-on: erro

      run-frontend: true
      frontend-paths: "static"
      template-paths: "templates"
      # Explícito, e igual ao resto da frota: todo achado de Stylelint entra
      # como aviso porque a etapa lê o arquivo inteiro, e o que reprova é
      # ESLint de severidade 2 e template estruturalmente quebrado.
      frontend-fail-on: erro

      # Rotas públicas: sem login, sem dado de ninguém.
      run-layout: true
      layout-setup-command: python manage.py importar_documentos_legais --publicar
      layout-paths: |
        /login/
        /termos/
        /privacidade/
      run-a11y: true
      # Sem isto /termos/ e /privacidade/ respondem 404: os documentos legais
      # são versionados em legal/documentos/ e só existem no banco depois de
      # publicados. O axe media a página de erro, e o que reprova não é
      # acessibilidade, é a rota vazia. Mesmo comando do layout.
      a11y-setup-command: python manage.py importar_documentos_legais --publicar
      a11y-paths: |
        /login/
        /termos/
        /privacidade/

      run-licencas: true
      run-sbom: true
      run-lock: true
      run-e2e: false

      # Desligado nas PRs do Dependabot: o GitHub não entrega os secrets do
      # Actions a esse ator, e sem o SONAR_TOKEN o scanner falha com
      # "Not authorized", travando toda atualização de dependência.
      #
      # A Análise Automática do SonarCloud foi DESLIGADA no projeto ao ligar
      # isto. Ela vem ativa quando o repositório é importado, e as duas não
      # convivem: com ela ligada o scanner do CI recusa a análise dizendo que
      # já existe uma automática. Ela também nunca recebe o coverage.xml, então
      # o gate media o projeto sem cobertura nenhuma.
      run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      sonar-project-key: rigst_dracma
      sonar-organization: rigst
      # As exceções ficam AQUI, e não marcadas como "Safe" na interface do
      # SonarCloud: assim são versionadas, aparecem no diff de quem mexer no
      # arquivo apontado, e somem junto com ele. Marcação na interface não
      # aparece em PR nenhuma. Cada uma foi conferida uma a uma em 18/09/2026,
      # quando o passivo inicial de 50 achados foi tratado; o que dava para
      # consertar foi consertado, e o que sobrou está abaixo com o motivo.
      #
      # e1  S4502, csrf_exempt no webhook do Telegram. Não há sessão nem cookie
      #     no caminho: quem chama é a Bot API, e a autenticação é o segredo em
      #     X-Telegram-Bot-Api-Secret-Token, conferido na primeira linha da
      #     view (bot.webhook.token_valido). CSRF protege navegador com sessão,
      #     que não é o caso, e exigi-lo aqui só faria o Telegram levar 403.
      # e2  S2208, `from .base import *` nos settings. É a forma canônica de
      #     settings em camadas no Django: listar nome por nome faria toda
      #     configuração nova precisar de duas edições, e a que faltasse
      #     sumiria em silêncio.
      # e3  S5332, http:// no provisionar.sh. São duas linhas: o bloco de
      #     nginx que responde ao desafio ACME (que é http por definição do
      #     protocolo, e existe justamente para emitir o certificado) e um
      #     curl em 127.0.0.1 conferindo se o gunicorn subiu, antes de existir
      #     TLS.
      # e4  S5247, {% autoescape off %} nos dois templates de e-mail. O corpo
      #     sai como texto puro; com escape ativo, um "&" em link viraria
      #     "&amp;" na caixa de entrada de quem recebe.
      # e5  S6845, tabindex no bloco rolável dos documentos legais. É o
      #     contrário de um problema: um container com rolagem precisa receber
      #     foco para poder ser rolado pelo teclado (WCAG 2.1.1). Sem o
      #     tabindex, quem não usa mouse não alcança o fim do texto que está
      #     sendo pedido para aceitar.
      # e6  LinksIdenticalTextsDifferentTargets em legal/documento.html. Os
      #     dois links estão em ramos opostos de um {% if %}: nunca aparecem
      #     juntos na mesma página. O analisador lê o template como HTML e não
      #     avalia as tags do Django.
      # e8  S107, os 16 parâmetros de `registrar_transacao`. A regra existe
      #     contra lista posicional longa, que se lê contando vírgulas e se
      #     erra trocando a ordem. Todos os 16 aqui são KEYWORD-ONLY (vêm
      #     depois de um `*`), com default, e toda chamada os nomeia: não há
      #     ordem para errar. É o ponto único de escrita do domínio, chamado
      #     pelas telas e pelas ferramentas da IA; empacotá-los num dataclass
      #     só moveria os mesmos 16 nomes para outro arquivo, e faria as duas
      #     pontas construírem um objeto intermediário para desmontá-lo aqui.
      # e7  S1192, o verbose_name "criado em" repetido nos models. Uma
      #     constante para rótulo de campo do Django é pior do que o problema:
      #     afasta o texto do campo que o usa e não é o que se lê em nenhum
      #     projeto Django.
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests_*.py,**/tests.py,**/fakes.py,**/*.js,**/*.html
        -Dsonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
        -Dsonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
        -Dsonar.issue.ignore.multicriteria.e1.resourceKey=bot/views.py
        -Dsonar.issue.ignore.multicriteria.e2.ruleKey=python:S2208
        -Dsonar.issue.ignore.multicriteria.e2.resourceKey=config/settings/*.py
        -Dsonar.issue.ignore.multicriteria.e3.ruleKey=shell:S5332
        -Dsonar.issue.ignore.multicriteria.e3.resourceKey=deploy/provisionar.sh
        -Dsonar.issue.ignore.multicriteria.e4.ruleKey=Web:S5247
        -Dsonar.issue.ignore.multicriteria.e4.resourceKey=templates/registration/*_email.html
        -Dsonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6845
        -Dsonar.issue.ignore.multicriteria.e5.resourceKey=templates/legal/*aceite.html
        -Dsonar.issue.ignore.multicriteria.e6.ruleKey=Web:LinksIdenticalTextsDifferentTargetsCheck
        -Dsonar.issue.ignore.multicriteria.e6.resourceKey=templates/legal/documento.html
        -Dsonar.issue.ignore.multicriteria.e7.ruleKey=python:S1192
        -Dsonar.issue.ignore.multicriteria.e7.resourceKey=**/models.py
        -Dsonar.issue.ignore.multicriteria.e8.ruleKey=python:S107
        -Dsonar.issue.ignore.multicriteria.e8.resourceKey=carteira/services.py
