{% extends "base.html" %}
{% block title %}Transações · Centavo{% endblock %}

{% block content %}
<h1>Transações</h1>

<form class="filtros" hx-get="{% url 'carteira:transacoes' %}"
      hx-target="#tabela" hx-trigger="change, submit" hx-push-url="true">
  <div class="campo">
    <label for="periodo">Período</label>
    <select name="periodo" id="periodo">
      <option value="mes">Este mês</option>
      <option value="3m">3 meses</option>
      <option value="6m">6 meses</option>
    </select>
  </div>
  <div class="campo">
    <label for="f-categoria">Categoria</label>
    <select name="categoria" id="f-categoria">
      <option value="">Todas</option>
      {% for c in categorias %}
      <option value="{{ c.nome }}" {% if c.nome == categoria %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="campo">
    <label for="f-tipo">Tipo</label>
    <select name="tipo" id="f-tipo">
      <option value="">Todos</option>
      <option value="despesa" {% if tipo == 'despesa' %}selected{% endif %}>Despesas</option>
      <option value="receita" {% if tipo == 'receita' %}selected{% endif %}>Receitas</option>
    </select>
  </div>
  <div class="campo campo--acao">
    <a class="botao-texto" href="{% url 'carteira:exportar' %}?periodo={{ request.GET.periodo|default:'mes' }}">
      Exportar CSV
    </a>
  </div>
</form>

<div id="tabela" class="cartao">
  {% include "carteira/_tabela_transacoes.html" %}
</div>
{% endblock %}
