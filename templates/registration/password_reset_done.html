{% extends "base.html" %}
{% block title %}Verifique seu e-mail · Dracma{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="pad">
      <div class="auth-head">
        <div class="logo-lg" aria-hidden="true"><svg><use href="#logo-trilhas"/></svg></div>
        <h1>Verifique seu e-mail</h1>
        <p>Se houver uma conta com esse endereço, enviamos um link para redefinir a senha. Confira também a caixa de spam.</p>
      </div>
      <a class="btn btn-ghost btn-block" href="{% url 'login' %}">Voltar ao login</a>
    </div>
  </div>
</div>
{% endblock %}
